# http 요청 -> https 리다이렉트
server {
    listen 80;
    server_name api.graypick.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 설정
server {
    listen 443 ssl;
    server_name api.graypick.co.kr;

    ssl_certificate /etc/letsencrypt/live/api.graypick.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.graypick.co.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Docker의 내장 DNS 리졸버(127.0.0.11)를 사용하도록 설정
    # Nginx가 동적인 서비스 이름(app-blue, app-green)을 찾을 수 있게 해줌
    resolver 127.0.0.11 valid=10s;

    include /etc/nginx/conf.d/service.inc;

    # 1. 사용자 트래픽
    location / {
        proxy_pass $service_url;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. 프로메테우스 모니터링 트래픽
    location /metrics {
        # $management_url 변수를 사용해 /actuator/prometheus 경로로 프록시
        proxy_pass $management_url/actuator/prometheus;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
